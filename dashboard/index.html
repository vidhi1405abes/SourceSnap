<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SourceSnap</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap");

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #03060a;
      }

      .font-mono {
        font-family: "JetBrains Mono", monospace;
      }

      .cyber-card {
        background: linear-gradient(
          145deg,
          rgba(13, 20, 35, 0.7) 0%,
          rgba(7, 11, 20, 0.95) 100%
        );
        border: 1px solid rgba(0, 229, 255, 0.12);
        box-shadow:
          0 15px 35px -12px rgba(0, 0, 0, 0.75),
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.05);
        backdrop-blur: 16px;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
      }

      .cyber-card:hover {
        transform: translateY(-4px);
        border-color: rgba(0, 229, 255, 0.5);
        box-shadow:
          0 25px 50px -15px rgba(0, 229, 255, 0.25),
          inset 0 1px 2px 0 rgba(0, 229, 255, 0.3);
      }

      .cyber-card::after {
        content: "";
        position: absolute;
        left: 0;
        top: 15%;
        height: 70%;
        width: 3px;
        background: #00e5ff;
        box-shadow: 0 0 12px #00e5ff;
        opacity: 0;
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
        transform: scaleY(0.6);
      }

      .cyber-card:hover::after {
        opacity: 1;
        transform: scaleY(1);
      }

      .premium-search,
      .premium-select {
        background: rgba(5, 8, 14, 0.9) !important;
        border: 1.5px solid rgba(0, 229, 255, 0.2) !important;
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6);
        transition: all 0.3s ease;
      }

      .premium-search:focus,
      .premium-select:focus {
        border-color: #00e5ff !important;
        background: rgba(9, 15, 28, 0.95) !important;
        box-shadow:
          0 0 20px rgba(0, 229, 255, 0.35),
          inset 0 1px 2px rgba(0, 0, 0, 0.4);
      }

      .bg-glow-1 {
        background: radial-gradient(
          circle at 10% 20%,
          rgba(0, 229, 255, 0.06),
          transparent 50%
        );
      }
      .bg-glow-2 {
        background: radial-gradient(
          circle at 90% 80%,
          rgba(37, 99, 235, 0.07),
          transparent 50%
        );
      }
    </style>
  </head>
  <body
    class="text-slate-300 min-h-screen relative overflow-x-hidden selection:bg-[#00e5ff]/20 selection:text-white antialiased"
  >
    <div class="absolute inset-0 bg-glow-1 pointer-events-none z-0"></div>
    <div class="absolute inset-0 bg-glow-2 pointer-events-none z-0"></div>

    <header
      class="border-b border-white/[0.05] bg-[#060a12]/85 sticky top-0 z-50 backdrop-blur-xl shadow-xl"
    >
      <div
        class="max-w-7xl mx-auto px-6 py-5 flex flex-col lg:flex-row justify-between items-center gap-6"
      >
        <div
          class="flex flex-col sm:flex-row items-center gap-5 text-center md:text-left w-full lg:w-auto justify-between lg:justify-start"
        >
          <div>
            <h1
              class="text-2xl font-black tracking-wider text-white flex items-center justify-center md:justify-start gap-2"
            >
              SourceSnap
              <span class="drop-shadow-[0_0_8px_rgba(0,229,255,0.4)] text-xl"
                >📸</span
              >
            </h1>
            <p
              class="text-[10px] text-[#00e5ff] font-mono font-bold tracking-[0.25em] uppercase mt-1 drop-shadow-[0_0_5px_rgba(0,229,255,0.2)]"
            >
              YOUR SECOND BRAIN • ARCHIVE
            </p>
          </div>

          <div
            id="statsBanner"
            class="flex flex-wrap justify-center items-center gap-2 font-mono text-[10px] bg-black/40 border border-white/[0.06] rounded-xl p-1.5 shadow-inner"
          >
            <button
              onclick="setTimeFilter('all')"
              id="btnFilterAll"
              class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border transition-all cursor-pointer bg-[#00e5ff]/10 border-[#00e5ff]/40 text-[#00e5ff] shadow-[0_0_8px_rgba(0,229,255,0.1)]"
            >
              <span class="text-slate-400 font-bold uppercase"
                >TOTAL LOGS:</span
              >
              <span id="totalLogsCount" class="font-black">0</span>
            </button>

            <button
              onclick="setTimeFilter('week')"
              id="btnFilterWeek"
              class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-transparent text-slate-400 hover:text-white hover:bg-white/[0.03] transition-all cursor-pointer"
            >
              <span class="font-bold uppercase">THIS WEEK:</span>
              <span id="thisWeekCount" class="text-emerald-400 font-black"
                >0</span
              >
            </button>

            <button
              onclick="setTimeFilter('today')"
              id="btnFilterToday"
              class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-transparent text-slate-400 hover:text-white hover:bg-white/[0.03] transition-all cursor-pointer"
            >
              <span class="font-bold uppercase">TODAY:</span>
              <span id="todayCount" class="text-amber-400 font-black">0</span>
            </button>
          </div>
        </div>

        <div
          class="w-full lg:w-auto flex flex-col sm:flex-row items-center gap-3"
        >
          <div class="relative w-full sm:w-64 md:w-80">
            <div
              class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-slate-400"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                ></path>
              </svg>
            </div>
            <input
              type="text"
              id="searchInput"
              oninput="filterCards()"
              placeholder="Search resources..."
              autocomplete="off"
              class="w-full pl-11 pr-4 py-2.5 premium-search rounded-xl focus:outline-none text-sm text-white placeholder-slate-500 font-medium"
            />
          </div>

          <div class="relative w-full sm:w-52">
            <select
              id="domainSelectFilter"
              onchange="selectDomainDropdown(this.value)"
              class="w-full pl-4 pr-10 py-2.5 premium-select rounded-xl focus:outline-none text-xs font-mono font-bold text-[#00e5ff] appearance-none cursor-pointer bg-no-repeat uppercase tracking-wide"
              style="
                background-image: url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='none' stroke='%2300e5ff' stroke-width='3' viewBox='0 0 24 24'><path stroke-linecap='round' stroke-linejoin='round' d='M19.5 8.25l-7.5 7.5-7.5-7.5'/></svg>&quot;);
                background-position: right 1rem center;
                background-size: 0.75rem;
              "
            >
              <option value="All">All Domains</option>
            </select>
          </div>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12 relative z-10">
      <div
        id="loading"
        class="text-center py-36 text-cyan-400 font-mono text-xs tracking-widest animate-pulse"
      >
        <div
          class="inline-block w-6 h-6 border-2 border-t-[#00e5ff] border-white/10 rounded-full animate-spin mb-4"
        ></div>
        <br />INITIALIZING DIGITAL MEMORY STREAM...
      </div>

      <div
        id="cardsGrid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden max-w-full"
      ></div>

      <div
        id="emptyState"
        class="hidden text-center py-24 border border-dashed border-[#00e5ff]/20 rounded-2xl bg-slate-950/40 backdrop-blur-md"
      >
        <p class="text-[#00e5ff] font-mono text-base mb-1 tracking-wide">
          No resources match your filters
        </p>
        <p
          class="text-[11px] text-slate-500 font-mono uppercase tracking-wider"
        >
          Try resetting the time filters or changing the domain dropdown.
        </p>
      </div>
    </main>

    <div
      id="toastNotification"
      class="fixed bottom-6 right-6 z-50 bg-[#060a12] border border-[#00e5ff]/40 px-4 py-2.5 rounded-xl font-mono text-xs text-white shadow-[0_10px_30px_rgba(0,229,255,0.15)] flex items-center gap-2 translate-y-10 opacity-0 pointer-events-none transition-all duration-300"
    >
      <span id="toastIcon" class="text-[#00e5ff]">⚙️</span>
      <span id="toastMessage">LINK COPY_SUCCESSFUL</span>
    </div>

    <script>
      // Fill these in with YOUR new Supabase project's values (see README.md
      // in this fix package). They must match the extension/config.js values
      // exactly, since both read/write the same "learnings" table.
      const SUPABASE_URL = "https://ojnwwedgszbvkrqxnfed.supabase.co";
      const SUPABASE_KEY = "sb_publishable_Ckfbw1TXKmfAIm91pzykOQ_QKEABb_3";
      let allLearnings = [];
      let selectedDomainTag = "All";
      let currentTimeFilter = "all";

      async function fetchLearnings() {
        try {
          const response = await fetch(
            `${SUPABASE_URL}/rest/v1/learnings?order=created_at.desc`,
            {
              method: "GET",
              headers: {
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`,
                "Content-Type": "application/json",
              },
            },
          );

          if (!response.ok) throw new Error("Could not fetch data");

          allLearnings = await response.json();
          document.getElementById("loading").classList.add("hidden");

          updateStatsBanner();
          populateDomainDropdown();
          renderCards(allLearnings);
        } catch (err) {
          document.getElementById("loading").innerHTML =
            "<span class='text-red-400 font-mono text-xs'>// LINK_ERROR: FAILED TO MOUNT RESOURCE STREAM.</span>";
          console.error(err);
        }
      }

      function showToast(message, icon = "⚙️") {
        const toast = document.getElementById("toastNotification");
        document.getElementById("toastIcon").innerText = icon;
        document.getElementById("toastMessage").innerText = message;

        toast.classList.remove(
          "translate-y-10",
          "opacity-0",
          "pointer-events-none",
        );
        toast.classList.add("translate-y-0", "opacity-100");

        setTimeout(() => {
          toast.classList.remove("translate-y-0", "opacity-100");
          toast.classList.add(
            "translate-y-10",
            "opacity-0",
            "pointer-events-none",
          );
        }, 2000);
      }

      // Dynamic Counter Calculations based on verified DB instances
      function updateStatsBanner() {
        const totalLogs = allLearnings.length;

        const oneWeekAgo = new Date();
        oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
        const thisWeekLogs = allLearnings.filter(
          (item) => new Date(item.created_at) >= oneWeekAgo,
        ).length;

        const todayStr = new Date().toDateString();
        const todayLogs = allLearnings.filter(
          (item) => new Date(item.created_at).toDateString() === todayStr,
        ).length;

        document.getElementById("totalLogsCount").innerText = totalLogs;
        document.getElementById("thisWeekCount").innerText = thisWeekLogs;
        document.getElementById("todayCount").innerText = todayLogs;
      }

      function getDomainTag(item) {
        let domainTag = "";
        try {
          if (item.url && item.url.includes(".")) {
            const hostname = new URL(item.url).hostname.replace("www.", "");
            if (
              hostname &&
              !hostname.includes("localhost") &&
              hostname !== ""
            ) {
              domainTag = hostname.toLowerCase();
            }
          }
        } catch (e) {
          if (item.url && item.url.toLowerCase().endsWith(".pdf")) {
            domainTag = "pdf file";
          }
        }
        return domainTag || "local resource";
      }

      function populateDomainDropdown() {
        const selectElement = document.getElementById("domainSelectFilter");
        const uniqueDomains = new Set();

        allLearnings.forEach((item) => {
          uniqueDomains.add(getDomainTag(item));
        });

        selectElement.innerHTML = '<option value="All">All Domains</option>';

        uniqueDomains.forEach((domain) => {
          const option = document.createElement("option");
          option.value = domain;
          option.innerText = domain;
          option.className = "bg-[#060a12] text-slate-300 font-mono";
          selectElement.appendChild(option);
        });
      }

      function selectDomainDropdown(val) {
        selectedDomainTag = val;
        filterCards();
      }

      function setTimeFilter(filterType) {
        currentTimeFilter = filterType;

        const btns = {
          all: document.getElementById("btnFilterAll"),
          week: document.getElementById("btnFilterWeek"),
          today: document.getElementById("btnFilterToday"),
        };

        Object.keys(btns).forEach((key) => {
          btns[key].className =
            "flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-transparent text-slate-400 hover:text-white hover:bg-white/[0.03] transition-all cursor-pointer";
        });

        if (filterType === "all") {
          btns.all.className =
            "flex items-center gap-1.5 px-3 py-1.5 rounded-lg border transition-all cursor-pointer bg-[#00e5ff]/10 border-[#00e5ff]/40 text-[#00e5ff] shadow-[0_0_8px_rgba(0,229,255,0.1)]";
        } else if (filterType === "week") {
          btns.week.className =
            "flex items-center gap-1.5 px-3 py-1.5 rounded-lg border transition-all cursor-pointer bg-emerald-500/10 border-emerald-500/40 text-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.1)]";
        } else if (filterType === "today") {
          btns.today.className =
            "flex items-center gap-1.5 px-3 py-1.5 rounded-lg border transition-all cursor-pointer bg-amber-500/10 border-amber-500/40 text-amber-400 shadow-[0_0_8px_rgba(245,158,11,0.1)]";
        }

        filterCards();
      }

      function copyToClipboard(url) {
        navigator.clipboard
          .writeText(url)
          .then(() => {
            showToast("LINK COPY_SUCCESSFUL", "⚙️");
          })
          .catch((err) => console.error("Could not copy text: ", err));
      }

      function renderCards(data) {
        const grid = document.getElementById("cardsGrid");
        const emptyState = document.getElementById("emptyState");
        grid.innerHTML = "";

        if (data.length === 0) {
          grid.classList.add("hidden");
          emptyState.classList.remove("hidden");
          return;
        }

        emptyState.classList.add("hidden");
        grid.classList.remove("hidden");

        data.forEach((item) => {
          const dateStr = new Date(item.created_at).toLocaleDateString(
            undefined,
            { month: "short", day: "numeric", year: "numeric" },
          );

          const domainTag = getDomainTag(item);

          const card = document.createElement("div");
          card.className =
            "cyber-card p-5 rounded-2xl flex flex-col justify-between min-h-[210px] group overflow-hidden";

          card.innerHTML = `
            <div>
              <div class="flex justify-between items-center mb-4">
                <span class="px-2 py-0.5 text-[9px] font-mono font-bold text-[#00e5ff] bg-[#00e5ff]/5 border border-[#00e5ff]/20 rounded-md tracking-wider uppercase">
                  ${domainTag}
                </span>
                <span class="text-[10px] font-mono text-slate-400 tracking-tight">${dateStr}</span>
              </div>

              <div class="mb-4">
                <h3 class="text-base font-bold text-white tracking-wide leading-snug line-clamp-2 group-hover:text-[#00e5ff] transition-colors duration-300">
                  <a href="${item.url}" target="_blank" class="hover:underline decoration-[#00e5ff]/20">${item.topic_name}</a>
                </h3>
              </div>

              <div class="w-full min-h-[40px] h-[40px] text-[13px] text-slate-200/90 px-3 rounded-xl bg-black/50 border border-white/[0.04] leading-none tracking-wide whitespace-normal text-left flex items-center justify-start group-hover:border-[#00e5ff]/20 transition-all duration-300 overflow-hidden line-clamp-1 break-words">
                ${item.notes ? item.notes.trim() : '<span class="text-slate-600 italic font-mono text-xs leading-none">No description appended.</span>'}
              </div>
            </div>

            <div class="mt-5 pt-3 border-t border-white/[0.04] w-full flex items-center justify-between">
              <a href="${item.url}" target="_blank" class="text-[11px] text-[#00e5ff] font-bold tracking-wider hover:text-white transition-colors inline-flex items-center gap-1.5 uppercase">
                LAUNCH RESOURCE
                <svg class="w-3.5 h-3.5 transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform text-[#00e5ff]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25"></path>
                </svg>
              </a>

              <button onclick="copyToClipboard('${item.url}')" class="p-1.5 text-slate-500 hover:text-[#00e5ff] border border-transparent hover:border-[#00e5ff]/20 rounded-md hover:bg-[#00e5ff]/5 transition-all duration-200 cursor-pointer" title="Copy Link Address">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                </svg>
              </button>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      // Filter Controller Engine
      function filterCards() {
        const query = document
          .getElementById("searchInput")
          .value.trim()
          .toLowerCase();

        const filtered = allLearnings.filter((item) => {
          const itemDate = new Date(item.created_at);

          if (currentTimeFilter === "today") {
            if (itemDate.toDateString() !== new Date().toDateString())
              return false;
          } else if (currentTimeFilter === "week") {
            const oneWeekAgo = new Date();
            oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
            if (itemDate < oneWeekAgo) return false;
          }

          if (selectedDomainTag !== "All") {
            const itemTag = getDomainTag(item);
            if (itemTag !== selectedDomainTag) return false;
          }

          if (!query) return true;
          return (
            item.topic_name && item.topic_name.toLowerCase().includes(query)
          );
        });

        renderCards(filtered);
      }

      window.onload = fetchLearnings;
    </script>
  </body>
</html>
